      o.userData.part=ud.part;o.userData.hip=ud.hip;
      if(k)(nodes[k]??=[]).push(o);
    });
    scene.add(g.scene);
  }
  build();show(new Set());
});
const on=new Set();
// Worn as WornController wears them: a part with `under` is left off
// while a piece of that kind is on (stockings under trousers); hip pieces
// stand out over the widest coat's `skirt`; pieces marked `over` spread
// out over the coats' `lie` (up, and deeper front to back).
function apply(){
  const kinds=new Set([...on].map(k=>INFO[k].kind));
  let skirt=0,front=0,up=0;
  for(const k of on){const i=INFO[k];skirt=Math.max(skirt,i.skirt||0);if(i.lie){front=Math.max(front,i.lie[0]);up=Math.max(up,i.lie[1])}}
  for(const k in nodes){
    const i=INFO[k],worn=on.has(k);
    for(const m of nodes[k]){
      const under=i.under&&i.under[m.userData.part];
      m.visible=worn&&!(under&&kinds.has(under));
      m.position.set(0,0,0);m.scale.set(1,1,1);
      const h=m.userData.hip;
      if(h&&skirt>0)m.position.set(h[0]*skirt,h[1]*skirt,h[2]*skirt);
      if(i.over&&(front||up)){m.position.y+=up;m.scale.z=1+2*front}
    }
  }
}
function vis(k,v){v?on.add(k):on.delete(k);apply()}
function show(set){on.clear();set.forEach(k=>on.add(k));for(const k in nodes)document.querySelectorAll(".c_"+k).forEach(c=>c.checked=set.has(k));apply()}
function row(k,label){
  const l=document.createElement("label");l.dataset.t=(INFO[k].title+" "+k+" "+label).toLowerCase();
  l.innerHTML=`<input type="checkbox" class="c_${k}"><span>${INFO[k].title}</span><span class="k">${INFO[k].tris}</span><button class="solo" title="Only this">◎</button>`;
  l.querySelector("input").onchange=e=>{vis(k,e.target.checked);document.querySelectorAll(".c_"+k).forEach(c=>c.checked=e.target.checked)};
  l.querySelector(".solo").onclick=e=>{e.preventDefault();show(new Set([k]))};
  return l;
}
function build(){
  const sets=document.getElementById("sets");
  const names=Object.keys(SETS).filter(n=>SETS[n].some(k=>nodes[k])).sort();
  if(names.length){
    const h=document.createElement("h2");h.textContent="Sets (worn together)";sets.appendChild(h);
    const bar=document.createElement("div");bar.className="bar";
    for(const n of names){const b=document.createElement("button");b.textContent=n;b.onclick=()=>show(new Set(SETS[n].filter(k=>nodes[k])));bar.appendChild(b)}
    sets.appendChild(bar);
  }
  const fresh=NEW.filter(k=>nodes[k]&&INFO[k]);
  if(fresh.length){
    const h=document.createElement("h2");h.textContent="New this batch";sets.appendChild(h);
    const b=document.createElement("button");b.textContent="Show the new ones";b.onclick=()=>show(new Set(fresh));
    const bar=document.createElement("div");bar.className="bar";bar.appendChild(b);sets.appendChild(bar);
    for(const k of fresh)sets.appendChild(row(k,"new"));
  }
  const groups={};
  for(const k of Object.keys(INFO).filter(k=>nodes[k]).sort((a,b)=>INFO[a].title.localeCompare(INFO[b].title))){(groups[INFO[k].kind]??=[]).push(k)}
  const list=document.getElementById("list");
  for(const kind of Object.keys(groups).sort()){
    const h=document.createElement("h2");h.textContent=kind;list.appendChild(h);
    for(const k of groups[kind])list.appendChild(row(k,kind));
  }
}
document.getElementById("all").onclick=()=>show(new Set(Object.keys(nodes)));
document.getElementById("none").onclick=()=>show(new Set());
document.getElementById("body").onclick=()=>{body.visible=!body.visible;(body.meshes||[]).forEach(m=>m.visible=body.visible)};
document.getElementById("wire").onclick=()=>mats.forEach(m=>m.wireframe=!m.wireframe);
document.getElementById("q").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#list label, #sets label").forEach(l=>l.style.display=l.dataset.t.includes(q)?"":"none")};
(function loop(){requestAnimationFrame(loop);renderer.render(scene,cam)})();
</script></body></html>
